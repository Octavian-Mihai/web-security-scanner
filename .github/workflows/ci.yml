name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q  # includes the coverage gate configured in pyproject.toml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Wheel installs and runs in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          /tmp/clean/bin/websec --version
          /tmp/clean/bin/websec rules | wc -l

  # End-to-end: run the Action itself against a deliberately vulnerable app.
  juice-shop:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
      pull-requests: write # pr-comment: post the findings summary on PRs
    services:
      juice-shop:
        image: bkimminich/juice-shop:latest
        ports: ["3000:3000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for Juice Shop
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ >/dev/null && exit 0
            sleep 2
          done
          echo "Juice Shop did not start" && exit 1

      # 1. Gate at "high": Juice Shop's worst finding on localhost is medium, so this passes
      #    and SARIF is uploaded for the Security tab.
      - name: Scan (gate = high, expect pass)
        uses: ./
        with:
          url: http://localhost:3000
          fail-on: high
          crawl-depth: "1"
          pr-comment: "true"
          sarif-file: results/juice-shop.sarif
          html-file: results/juice-shop.html

      - name: Findings match what Juice Shop is known to expose
        run: |
          pip install jsonschema
          python scripts/assert_findings.py results/juice-shop.sarif \
            WSS038 WSS001 WSS010 WSS042 WSS044 \
            --forbid WSS006 WSS005 WSS030

      # 2. Gate at "medium": the same findings must now fail the build.
      - name: Scan (gate = medium, expect failure)
        id: fail
        continue-on-error: true
        uses: ./
        with:
          url: http://localhost:3000
          fail-on: medium
          upload-sarif: "false"
          sarif-file: results/gate-check.sarif

      - name: Assert the gate actually failed the build
        if: steps.fail.outcome != 'failure'
        run: echo "::error::fail-on=medium should have failed on Juice Shop" && exit 1

      # 3. Baseline file: accepted risks are suppressed (with reasons) and the gate passes.
      - name: Scan (gate = medium with baseline, expect pass)
        id: baseline
        uses: ./
        with:
          url: http://localhost:3000
          fail-on: medium
          config: examples/juice-shop.websec.toml
          upload-sarif: "false"
          sarif-file: results/baseline.sarif

      - name: Baseline suppressed exactly the accepted findings
        run: |
          test "${{ steps.baseline.outputs.suppressed }}" = "4"
          python scripts/assert_findings.py results/baseline.sarif --forbid WSS001 WSS010 WSS042 WSS044

      # 4. Scope safety: a redirect off-scope must abort the scan with exit 2.
      - name: Scanner refuses out-of-scope targets
        run: |
          python -m pip install --quiet .
          python - <<'PY'
          import http.server, threading, subprocess, sys
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(302); self.send_header("Location", "http://localhost:3000/"); self.end_headers()
              def log_message(self, *a): pass
          srv = http.server.HTTPServer(("127.0.0.1", 0), H)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          rc = subprocess.run(["websec", "scan", f"http://127.0.0.1:{srv.server_port}/"]).returncode
          sys.exit(0 if rc == 2 else f"expected exit code 2, got {rc}")
          PY
